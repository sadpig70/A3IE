<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" style="background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);">
  <defs>
    <!-- 전기 흐름 그라디언트 -->
    <linearGradient id="electricFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0">
        <animate attributeName="offset" values="-1;1" dur="1.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" style="stop-color:#00ffff;stop-opacity:1">
        <animate attributeName="offset" values="-0.7;1.3" dur="1.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1">
        <animate attributeName="offset" values="-0.5;1.5" dur="1.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" style="stop-color:#00ffff;stop-opacity:1">
        <animate attributeName="offset" values="-0.3;1.7" dur="1.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0">
        <animate attributeName="offset" values="0;2" dur="1.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- 노드 글로우 효과 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 펄스 애니메이션용 -->
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.3"/>
    </radialGradient>
    
    <!-- 화살표 마커 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ffff" filter="url(#glow)"/>
    </marker>
    
    <!-- 점선 패턴 (움직이는 효과) -->
    <pattern id="movingDots" width="20" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#00ffff">
        <animate attributeName="cx" values="2;22" dur="0.5s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>
  
  <!-- 배경 그리드 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- 타이틀 -->
  <text x="600" y="45" text-anchor="middle" fill="#00ffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" filter="url(#glowStrong)">
    A3IE WORKFLOW
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="70" text-anchor="middle" fill="#6699ff" font-family="Arial, sans-serif" font-size="14">
    Artificial Intelligence Infinite Idea Engine
  </text>
  
  <!-- ===== STEP 노드들 ===== -->
  
  <!-- STEP 1: News Collection -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1a3a" stroke="#00ffff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#00ffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 1</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">News Collection</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="10">8 AIs × 10 items</text>
  </g>
  
  <!-- STEP 2: Analysis -->
  <g transform="translate(100, 250)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1a3a" stroke="#00ccff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#00ccff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 2</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Analysis</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="10">4 perspectives</text>
  </g>
  
  <!-- STEP 3: Insight -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1a3a" stroke="#0099ff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#0099ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 3</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Insight Extraction</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="10">8 × 10 insights</text>
  </g>
  
  <!-- STEP 4: Idea Generation -->
  <g transform="translate(350, 370)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1a3a" stroke="#0066ff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#0066ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 4</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Idea Generation</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="10">8 × 3 = 24 ideas</text>
  </g>
  
  <!-- STEP 5: Top 3 Selection -->
  <g transform="translate(600, 370)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1a3a" stroke="#3366ff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#3366ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 5</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Top 3 Selection</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="10">8 AIs vote</text>
  </g>
  
  <!-- STEP 6: Global Selection -->
  <g transform="translate(850, 370)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1a3a" stroke="#6633ff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#6633ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 6</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Global Selection</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="10">Cross-AI → 1</text>
  </g>
  
  <!-- STEP 7: User Verification -->
  <g transform="translate(1000, 250)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#0a2a1a" stroke="#00ff66" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.8s"/>
    </rect>
    <text x="70" y="25" text-anchor="middle" fill="#00ff66" font-family="Arial, sans-serif" font-size="11" font-weight="bold">STEP 7</text>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">User Verification</text>
    <text x="70" y="60" text-anchor="middle" fill="#66ffaa" font-family="Arial, sans-serif" font-size="10">Final Decision</text>
  </g>
  
  <!-- ===== 연결선 (애니메이션 전기 흐름) ===== -->
  
  <!-- STEP 1 → STEP 2 -->
  <line x1="170" y1="200" x2="170" y2="250" stroke="#003366" stroke-width="3"/>
  <line x1="170" y1="200" x2="170" y2="250" stroke="url(#electricFlow)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- STEP 2 → STEP 3 -->
  <line x1="170" y1="320" x2="170" y2="370" stroke="#003366" stroke-width="3"/>
  <line x1="170" y1="320" x2="170" y2="370" stroke="url(#electricFlow)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="1s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  
  <!-- STEP 3 → STEP 4 -->
  <line x1="240" y1="405" x2="350" y2="405" stroke="#003366" stroke-width="3"/>
  <line x1="240" y1="405" x2="350" y2="405" stroke="url(#electricFlow)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </line>
  
  <!-- STEP 4 → STEP 5 -->
  <line x1="490" y1="405" x2="600" y2="405" stroke="#003366" stroke-width="3"/>
  <line x1="490" y1="405" x2="600" y2="405" stroke="url(#electricFlow)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
  </line>
  
  <!-- STEP 5 → STEP 6 -->
  <line x1="740" y1="405" x2="850" y2="405" stroke="#003366" stroke-width="3"/>
  <line x1="740" y1="405" x2="850" y2="405" stroke="url(#electricFlow)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="1.2s" repeatCount="indefinite" begin="0.8s"/>
  </line>
  
  <!-- STEP 6 → STEP 7 -->
  <path d="M 990 405 Q 1070 405 1070 320" fill="none" stroke="#003366" stroke-width="3"/>
  <path d="M 990 405 Q 1070 405 1070 320" fill="none" stroke="url(#electricFlow)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,200;100,100;200,0" dur="1.2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- ===== 8 AI 아이콘 클러스터 ===== -->
  <g transform="translate(300, 120)">
    <text x="200" y="0" text-anchor="middle" fill="#6699ff" font-family="Arial, sans-serif" font-size="12">8 AIs Working in Parallel</text>
    
    <!-- AI 노드들 -->
    <g>
      <circle cx="50" cy="40" r="18" fill="#1a1a3a" stroke="#00ffff" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="45" text-anchor="middle" fill="#00ffff" font-family="Arial, sans-serif" font-size="8">GPT</text>
    </g>
    <g>
      <circle cx="100" cy="40" r="18" fill="#1a1a3a" stroke="#00ccff" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <text x="100" y="45" text-anchor="middle" fill="#00ccff" font-family="Arial, sans-serif" font-size="8">Gemini</text>
    </g>
    <g>
      <circle cx="150" cy="40" r="18" fill="#1a1a3a" stroke="#ff9966" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <text x="150" y="45" text-anchor="middle" fill="#ff9966" font-family="Arial, sans-serif" font-size="8">Claude</text>
    </g>
    <g>
      <circle cx="200" cy="40" r="18" fill="#1a1a3a" stroke="#66ff99" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <text x="200" y="45" text-anchor="middle" fill="#66ff99" font-family="Arial, sans-serif" font-size="8">Grok</text>
    </g>
    <g>
      <circle cx="250" cy="40" r="18" fill="#1a1a3a" stroke="#ff66cc" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <text x="250" y="45" text-anchor="middle" fill="#ff66cc" font-family="Arial, sans-serif" font-size="8">Kimi</text>
    </g>
    <g>
      <circle cx="300" cy="40" r="18" fill="#1a1a3a" stroke="#6699ff" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="300" y="45" text-anchor="middle" fill="#6699ff" font-family="Arial, sans-serif" font-size="8">Deep</text>
    </g>
    <g>
      <circle cx="350" cy="40" r="18" fill="#1a1a3a" stroke="#ffcc66" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <text x="350" y="45" text-anchor="middle" fill="#ffcc66" font-family="Arial, sans-serif" font-size="8">Qwen</text>
    </g>
    <g>
      <circle cx="400" cy="40" r="18" fill="#1a1a3a" stroke="#cc99ff" stroke-width="1.5">
        <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite" begin="1.4s"/>
      </circle>
      <text x="400" y="45" text-anchor="middle" fill="#cc99ff" font-family="Arial, sans-serif" font-size="8">Perp</text>
    </g>
  </g>
  
  <!-- ===== Funnel 시각화 ===== -->
  <g transform="translate(400, 480)">
    <text x="200" y="0" text-anchor="middle" fill="#6699ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FUNNEL: Diversity → Convergence</text>
    
    <!-- 퍼널 형태 -->
    <polygon points="50,30 350,30 300,100 100,100" fill="none" stroke="#3366ff" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </polygon>
    
    <text x="200" y="50" text-anchor="middle" fill="#66ffff" font-family="Arial, sans-serif" font-size="11">80 news → 24 ideas → 1 final</text>
    
    <!-- 수렴 입자들 -->
    <circle cx="80" cy="45" r="3" fill="#00ffff">
      <animate attributeName="cx" values="80;180;200" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="45;70;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="45" r="3" fill="#00ffff">
      <animate attributeName="cx" values="320;220;200" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="cy" values="45;70;90" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="150" cy="40" r="3" fill="#66ffff">
      <animate attributeName="cx" values="150;190;200" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="cy" values="40;65;90" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="250" cy="40" r="3" fill="#66ffff">
      <animate attributeName="cx" values="250;210;200" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="cy" values="40;65;90" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    
    <!-- 최종 결과 -->
    <circle cx="200" cy="90" r="8" fill="#00ff66" filter="url(#glowStrong)">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ===== 철학 태그라인 ===== -->
  <text x="600" y="630" text-anchor="middle" fill="#336699" font-family="Arial, sans-serif" font-size="12" font-style="italic">
    "No tool lock-in. No strict format. Maximize AI diversity."
  </text>
  
  <!-- 버전 -->
  <text x="1150" y="680" text-anchor="end" fill="#334455" font-family="Arial, sans-serif" font-size="10">
    A3IE v1.0 | HAO Framework
  </text>
</svg>
